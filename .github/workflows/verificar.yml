name: Verificar kit
on:
  push:
  pull_request:
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Consistência do kit
        run: python3 scripts/verificar.py
      - name: Instalador
        run: bash scripts/testar-instalacao.sh
      - name: Métricas
        run: bash scripts/testar-metricas.sh
